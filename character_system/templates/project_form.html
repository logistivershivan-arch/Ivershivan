{% extends 'base.html' %}
{% block title %}{% if project %}编辑世界观{% else %}新建世界观{% endif %}{% endblock %}
{% block page_title %}{% if project %}编辑世界观{% else %}新建世界观{% endif %}{% endblock %}
{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <div style="margin-bottom: 20px;">
        <a href="{{ url_for('project_list') }}" class="btn btn-default">← 返回列表</a>
    </div>
    <form method="POST" class="card" style="padding: 30px;">
        <div class="form-group">
            <label>世界观名称 <span style="color: #f5222d;">*</span></label>
            <input type="text" name="name" required class="form-control" value="{{ project.name if project else '' }}" placeholder="给你的世界观起个名字">
        </div>
        <div class="form-group">
            <label>世界观简介（可选）</label>
            <textarea name="description" class="form-control" rows="4" placeholder="简单介绍一下这个世界观">{{ project.description if project else '' }}</textarea>
        </div>
        <div style="text-align: center; margin-top: 30px;">
            <button type="submit" class="btn btn-primary" style="padding: 10px 40px;">
                {% if project %}保存修改{% else %}创建世界观{% endif %}
            </button>
        </div>
    </form>
</div>
{% endblock %}
