{% extends 'base.html' %}
{% block title %}新建长篇{% endblock %}
{% block page_title %}新建长篇小说{% endblock %}
{% block content %}
<div style="max-width: 700px; margin: 0 auto;">
    <div style="margin-bottom: 20px;">
        <a href="{{ url_for('story_list') }}" class="btn btn-default">← 返回列表</a>
    </div>
    <form method="POST" class="card" style="padding: 30px;">
        <div class="form-group">
            <label>小说标题 <span style="color: #f5222d;">*</span></label>
            <input type="text" name="title" required class="form-control" placeholder="输入小说名称">
        </div>
        <div class="form-group">
            <label>作者（可选）</label>
            <input type="text" name="author" class="form-control" placeholder="输入作者名">
        </div>
        <div class="form-group">
            <label>小说简介（可选）</label>
            <textarea name="description" class="form-control" rows="5" placeholder="输入小说简介"></textarea>
        </div>
        <div style="text-align: center; margin-top: 30px;">
            <button type="submit" class="btn btn-primary" style="padding: 10px 40px;">创建小说</button>
        </div>
    </form>
</div>
{% endblock %}
