{% extends 'base.html' %}
{% block title %}新建章节 - {{ story.title }}{% endblock %}
{% block page_title %}新建章节 - {{ story.title }}{% endblock %}
{% block content %}
<div style="max-width: 1000px; margin: 0 auto;">
    <div style="margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
        <a href="{{ url_for('story_long_detail', story_id=story.id) }}" class="btn btn-default">← 返回目录</a>
        <button type="submit" form="chapter-form" class="btn btn-primary">💾 保存章节</button>
    </div>

    <form id="chapter-form" method="POST">
        <div class="card" style="margin-bottom: 20px; padding: 24px;">
            <div style="display: grid; grid-template-columns: 150px 1fr; gap: 20px; margin-bottom: 20px;">
                <div>
                    <label style="display: block; font-size: 13px; color: #8c8c8c; margin-bottom: 8px;">章节号</label>
                    <input type="text" name="chapter_number" class="form-control" placeholder="如：第一章" value="{{ chapter.chapter_number if chapter else '' }}">
                </div>
                <div>
                    <label style="display: block; font-size: 13px; color: #8c8c8c; margin-bottom: 8px;">章节标题</label>
                    <input type="text" name="title" required class="form-control" placeholder="输入章节标题" value="{{ chapter.title if chapter else '' }}">
                </div>
            </div>

            <textarea name="description" placeholder="章节摘要（可选）"
                      style="width: 100%; min-height: 60px; border: none; outline: none; padding: 0; margin-bottom: 20px; resize: none; font-size: 14px; color: #595959; border-bottom: 1px solid #f0f0f0; padding-bottom: 12px;">{{ chapter.description if chapter else '' }}</textarea>

            <!-- 标签折叠 -->
            <details style="margin-bottom: 0;">
                <summary style="cursor: pointer; font-size: 13px; color: #8c8c8c; padding: 8px 0;">展开关联角色/地区/阵营（可选）</summary>
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding-top: 15px;">
                    <div>
                        <label style="display: block; font-size: 13px; color: #8c8c8c; margin-bottom: 8px;">登场角色</label>
                        <select name="character_ids[]" multiple style="height: 100px; width: 100%;">
                            {% for char in characters %}
                            <option value="{{ char.id }}">{{ char.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label style="display: block; font-size: 13px; color: #8c8c8c; margin-bottom: 8px;">发生地区</label>
                        <select name="region_ids[]" multiple style="height: 100px; width: 100%;">
                            {% for rid, rname in all_regions %}
                            <option value="{{ rid }}">{{ rname }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label style="display: block; font-size: 13px; color: #8c8c8c; margin-bottom: 8px;">关联阵营</label>
                        <select name="faction_ids[]" multiple style="height: 100px; width: 100%;">
                            {% for fid, fname in all_factions %}
                            <option value="{{ fid }}">{{ fname }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </details>
        </div>

        <div class="card" style="padding: 24px;">
            <label style="display: block; font-size: 13px; color: #8c8c8c; margin-bottom: 12px;">章节正文</label>
            <textarea id="content-textarea" name="content" placeholder="开始写作..."
          style="width: 100%; min-height: 600px; border: none; outline: none; padding: 0; resize: vertical; font-size: 16px; line-height: 1.8; font-family: inherit;">{{ chapter.content if chapter else '' }}</textarea>        </div>
    </form>
</div>

<script>
const textarea = document.getElementById('content-textarea');
const indent = '\u3000\u3000'; // 两个全角空格=中文两格缩进

// 初始化：编辑旧内容时自动加缩进
if (textarea.value) {
    textarea.value = textarea.value.split('\n').map(line => {
        return line.trim() ? indent + line.trimStart() : line;
    }).join('\n');
}

// 粘贴时自动给每段加首行缩进
textarea.addEventListener('paste', function(e) {
    e.preventDefault();
    let pasteText = (e.clipboardData || window.clipboardData).getData('text');
    pasteText = pasteText.split('\n').map(line => {
        return line.trim() ? indent + line.trimStart() : line;
    }).join('\n');
    const start = textarea.selectionStart;
    const end = textarea.selectionEnd;
    textarea.value = textarea.value.substring(0, start) + pasteText + textarea.value.substring(end);
    textarea.selectionStart = textarea.selectionEnd = start + pasteText.length;
});

// 按回车自动在下一行加缩进
textarea.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        e.preventDefault();
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        const value = textarea.value;
        textarea.value = value.substring(0, start) + '\n' + indent + value.substring(end);
        textarea.selectionStart = textarea.selectionEnd = start + 1 + indent.length;
    }
});
</script>
{% endblock %}
