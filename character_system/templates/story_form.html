{% extends 'base.html' %}

{% block title %}{% if story %}编辑故事{% else %}新建短篇故事{% endif %}{% endblock %}
{% block page_title %}{% if story %}编辑故事{% else %}新建短篇故事{% endif %}{% endblock %}

{% block content %}
<div style="max-width: 1000px; margin: 0 auto;">
    <div style="margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
        <a href="{{ url_for('story_list') }}" class="btn btn-default">← 返回列表</a>
        <button type="submit" form="story-form" class="btn btn-primary">💾 保存故事</button>
    </div>

    <form id="story-form" method="POST">
        <div class="card" style="margin-bottom: 20px; padding: 24px;">
            <input type="text" name="title" required placeholder="输入故事标题"
                   value="{{ story.title if story else '' }}"
                   style="width: 100%; border: none; outline: none; padding: 0; font-size: 24px; font-weight: 600; margin-bottom: 16px;">

            <textarea name="description" placeholder="故事摘要/Summary（可选）"
                      style="width: 100%; min-height: 60px; border: none; outline: none; padding: 0; margin-bottom: 20px; resize: none; font-size: 14px; color: #595959; border-bottom: 1px solid #f0f0f0; padding-bottom: 12px;">{{ story.description if story else '' }}</textarea>

            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 0;">
                <div>
                    <label style="display: block; font-size: 13px; color: #8c8c8c; margin-bottom: 8px;">登场角色</label>
                    <select name="character_ids[]" multiple style="height: 100px; width: 100%;">
                        {% for char in characters %}
                        <option value="{{ char.id }}" {% if char.id in selected_characters %}selected{% endif %}>{{ char.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label style="display: block; font-size: 13px; color: #8c8c8c; margin-bottom: 8px;">发生地区</label>
                    <select name="region_ids[]" multiple style="height: 100px; width: 100%;">
                        {% for rid, rname in all_regions %}
                        <option value="{{ rid }}" {% if rid in selected_regions %}selected{% endif %}>{{ rname }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label style="display: block; font-size: 13px; color: #8c8c8c; margin-bottom: 8px;">关联阵营</label>
                    <select name="faction_ids[]" multiple style="height: 100px; width: 100%;">
                        {% for fid, fname in all_factions %}
                        <option value="{{ fid }}" {% if fid in selected_factions %}selected{% endif %}>{{ fname }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
        </div>

        <div class="card" style="padding: 24px;">
            <label style="display: block; font-size: 13px; color: #8c8c8c; margin-bottom: 12px;">故事正文</label>
            <textarea id="content-textarea" name="content" placeholder="开始写作..."
          style="width: 100%; min-height: 600px; border: none; outline: none; padding: 0; resize: vertical; font-size: 16px; line-height: 1.8; font-family: inherit;">{{ story.content if story else '' }}</textarea>
        </div>
    </form>
</div>

<script>
const textarea = document.getElementById('content-textarea');
const indent = '\u3000\u3000'; // 两个全角空格=中文两格缩进

// 初始化：编辑旧内容时自动加缩进
if (textarea.value) {
    textarea.value = textarea.value.split('\n').map(line => {
        return line.trim() ? indent + line.trimStart() : line;
    }).join('\n');
}

// 粘贴时自动给每段加首行缩进
textarea.addEventListener('paste', function(e) {
    e.preventDefault();
    let pasteText = (e.clipboardData || window.clipboardData).getData('text');
    pasteText = pasteText.split('\n').map(line => {
        return line.trim() ? indent + line.trimStart() : line;
    }).join('\n');
    const start = textarea.selectionStart;
    const end = textarea.selectionEnd;
    textarea.value = textarea.value.substring(0, start) + pasteText + textarea.value.substring(end);
    textarea.selectionStart = textarea.selectionEnd = start + pasteText.length;
});

// 按回车自动在下一行加缩进
textarea.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        e.preventDefault();
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        const value = textarea.value;
        textarea.value = value.substring(0, start) + '\n' + indent + value.substring(end);
        textarea.selectionStart = textarea.selectionEnd = start + 1 + indent.length;
    }
});
</script>
{% endblock %}
